name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.56 can't install Chromium
    # ("Playwright does not support chromium on ubuntu26.04-x64"). Move on together with
    # a Playwright upgrade that supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parklet
          POSTGRES_PASSWORD: parklet
          POSTGRES_DB: parklet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parklet" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://parklet:parklet@localhost:5432/parklet
      TEST_DATABASE_URL: postgres://parklet:parklet@localhost:5432/parklet_test
      E2E_DATABASE_URL: postgres://parklet:parklet@localhost:5432/parklet_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create test databases
        run: psql postgres://parklet:parklet@localhost:5432/parklet -f scripts/init-db.sql
      - name: Prepare the API roles
        # As on Supabase, the roles PostgREST uses exist before the first migration.
        run: |
          node scripts/postgrest.mjs --prepare
          node scripts/postgrest.mjs --prepare --db parklet_test
          node scripts/postgrest.mjs --prepare --db parklet_e2e
      - name: Migrate
        run: |
          npm run db:migrate
          DATABASE_URL=$TEST_DATABASE_URL npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
