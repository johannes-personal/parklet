services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: parklet
      POSTGRES_PASSWORD: parklet
      POSTGRES_DB: parklet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

volumes:
  pgdata:
